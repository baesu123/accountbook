<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>나의 가계부</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h2 class="mb-4">💰 심플 가계부</h2>

<div class="card mb-4">
    <div class="card-body">
        <form th:action="@{/add}" method="post" class="row g-3">
            <div class="col-md-3">
                <input type="text" name="title" class="form-control" placeholder="내역(예: 점심식사)" required>
            </div>
            <div class="col-md-2">
                <input type="number" name="amount" class="form-control" placeholder="금액" required>
            </div>
            <div class="col-md-2">
                <select name="type" class="form-select">
                    <option value="EXPENSE">지출</option>
                    <option value="INCOME">수입</option>
                </select>
            </div>
            <div class="col-md-3">
                <input type="text" name="category" class="form-control" placeholder="카테고리">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">등록</button>
            </div>
        </form>
    </div>
</div>

<table class="table table-striped">
    <thead class="table-dark">
    <tr>
        <th>날짜</th>
        <th>내역</th>
        <th>카테고리</th>
        <th>유형</th>
        <th>금액</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${transactions}">
        <td th:text="${#temporals.format(item.regDate, 'yyyy-MM-dd HH:mm')}">2024-01-01</td>
        <td th:text="${item.title}">식비</td>
        <td th:text="${item.category}">식사</td>
        <td>
                    <span th:text="${item.type == 'INCOME' ? '수입' : '지출'}"
                          th:class="${item.type == 'INCOME' ? 'badge bg-success' : 'badge bg-danger'}">
                    </span>
        </td>
        <td th:text="${#numbers.formatInteger(item.amount, 0, 'COMMA')} + '원'">1,000원</td>
    </tr>
    </tbody>
</table>
</body>
</html>
